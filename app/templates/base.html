<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KeepIt{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/base.css">

  <link rel="icon" href="/static/img/coin.svg" type="image/svg+xml">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  {% block styles %}{% endblock %}
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
<script>
  function formatLocalDeadlines() {
    document.querySelectorAll('[data-utc]').forEach(function(el) {
      var raw = el.getAttribute('data-utc');
      if (!raw) return;
      var clean = raw.trim().replace(' ', 'T');
      if (!clean.endsWith('Z') && !clean.includes('+') && clean.indexOf('-', 10) === -1) {
        clean += 'Z';
      }
      var d = new Date(clean);
      if (!isNaN(d.getTime())) {
        var pad = function(n) { return n < 10 ? '0' + n : n; };
        var yr = d.getFullYear();
        var mo = pad(d.getMonth() + 1);
        var da = pad(d.getDate());
        var hr = pad(d.getHours());
        var mi = pad(d.getMinutes());
        el.textContent = yr + '-' + mo + '-' + da + ' ' + hr + ':' + mi;
      }
    });
  }
  document.addEventListener('DOMContentLoaded', formatLocalDeadlines);
  document.body.addEventListener('htmx:afterSwap', formatLocalDeadlines);
</script>
  {% block body %}{% endblock %}

</body>
</html>
