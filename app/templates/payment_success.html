{% extends "base_logged_in.html" %}

{% block title %}Payment Successful · KeepIt{% endblock %}

{% block styles %}
  <link rel="stylesheet" href="/static/css/payment_message.css">
{% endblock %}

{% block content %}
<div class="payment-message-container">
  <section class="payment-message-card">
    <h1 class="payment-message-title">Payment Successful!</h1>
    <p class="payment-message-text">
      Your payment has been processed successfully. 
      <br>You've joined the challenge and can now access it.
    </p>
    <div class="payment-message-actions">
      <a href="/challenges/{{ challenge_id }}" class="payment-btn">Go to Challenge</a>
    </div>
  </section>
</div>
{% endblock %}
